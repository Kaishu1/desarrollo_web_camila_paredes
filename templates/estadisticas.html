<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estadísticas</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estadisticas.css') }}">
</head>

<body>
    <header>
        <h1>Estadísticas</h1>

        <nav>
            <a href="{{ url_for('index') }}">Inicio</a>
            <a href="{{ url_for('listadoMiembros') }}">Listado de miembros</a>
            <a href="{{ url_for('listadoActividades') }}">Listado de actividades</a>
            <a href="{{ url_for('registroMiembros') }}">Regístrate</a>
        </nav>
    </header>

    <main class="contenedor-estadisticas">
        <section class="tarjeta-grafico" aria-labelledby="titulo-miembros-dia">
            <h2 id="titulo-miembros-dia">Miembros registrados por día</h2>
            <div id="grafico-miembros-dia"></div>
            <p id="mensaje-miembros-dia"></p>
        </section>
        <section class="tarjeta-grafico" aria-labelledby="titulo-actividades-tipo">
            <h2 id="titulo-actividades-tipo">Actividades por tipo</h2>
            <div id="grafico-actividades-tipo"></div>
            <p id="mensaje-actividades-tipo"></p>
        </section>
        <section class="tarjeta-grafico" aria-labelledby="titulo-actividades-comuna">
            <h2 id="titulo-actividades-comuna">Actividades por comuna</h2>
            <div id="grafico-actividades-comuna"></div>
            <p id="mensaje-actividades-comuna"></p>
        </section>
    </main>

    <script src="https://code.highcharts.com/highcharts.js"></script>
    <script src="{{ url_for('static', filename='js/estadisticas.js') }}"></script>
</body>
</html>
